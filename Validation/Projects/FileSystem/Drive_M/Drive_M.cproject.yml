project:
  description: File System Memory Card Drive Validation

  packs:
    - pack: Keil::MDK-Middleware@^8.3.0-0
    - pack: ARM::CMSIS@^6.3.0
    - pack: ARM::CMSIS-Compiler@^2.3.0
    - pack: ARM::CMSIS-RTX@^5.9.1
    - pack: ARM::CMSIS-View@^1.2.0

  connections:
    - connect: File System Validation for Drive M
      provides:
        - CMSIS-RTOS2
      consumes:
        - CMSIS_MCI
        - STDOUT

  define:
    - FS_DRIVE: \"M\"

  groups:
    - group: Documentation
      files:
        - file: README.md

    - group: Test Cases
      add-path:
        - ./
        - ../../../Include
        - ../../../Source
        - ../../../Source/FileSystem
      files:
        - file: ../../../Source/FileSystem/MW_CV_FS.c
        - file: ../../../Source/FileSystem/MW_CV_FS_Core.c
        - file: ../../../Source/FileSystem/MW_CV_FS_FAT.c
        - file: ../../../Source/FileSystem/MW_CV_FS_EFS.c
        - file: ../../../Source/FileSystem/MW_CV_FS_Clib.c
        - file: ../../../Source/FileSystem/MW_CV_FS_MC.c
        - file: ../../../Source/FileSystem/MW_CV_FS_IOC.c
        - file: ../../../Source/FileSystem/MW_CV_FS_Performance.c
        - file: ../../../Source/FileSystem/MW_CV_FS_Stress.c

    - group: Test Framework
      add-path:
        - ../../../Include
        - ../../../Source/FileSystem
      files:
        - file: MW_CV_Config.h
        - file: ../../../Source/MW_CV_Main.c
        - file: ../../../Source/MW_CV_Framework.c
        - file: ../../../Source/MW_CV_TestReport.c
        - file: ../../../Source/MW_CV_TestSuite.c
        - file: ../../../Source/MW_CV_Timer.c

  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS-View:Event Recorder&DAP
    - component: CMSIS-Compiler:File Interface:MDK-MW File System
    - component: File System&MDK:CORE
    - component: File System&MDK:Drive:Memory Card

  layers:
    - layer: $Board-Layer$
      type: Board

  output:
    type:
      - elf
      - hex
      - map
